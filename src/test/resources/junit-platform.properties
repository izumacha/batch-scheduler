# テスト 1 件あたりの既定タイムアウト。
# 止め方は Thread.interrupt() なので、効くのは割り込み可能な待ち（sleep・I/O 待ちの
# 一部・無限ループ中の割り込みチェック）に限られる。open(2) の中でブロックした
# スレッドには効かないため、Durability の FIFO 検査の退行はこれでは捕まらない。
# そちらは pom.xml の forkedProcessTimeoutInSeconds が外側から切る。
# 通常のテストは 1 秒未満で終わるので、60 秒は正常系に影響しない。
junit.jupiter.execution.timeout.default = 60 s
