# テスト 1 件あたりの既定タイムアウト。
# Durability の FIFO 検査は「ガードが外れたら open(2) が相手を待って固まる」ことを
# 前提に回帰を検出する。上限が無いと、その退行はテスト失敗ではなく CI ジョブの
# ハング（GitHub Actions の 6 時間上限まで）として現れ、原因を示すテスト名も出ない。
# 通常のテストは 1 秒未満で終わり、最も重い JobRunner のリトライ検査でも数秒なので、
# 60 秒は正常系に影響しない余裕を持ちつつ「固まった」ことを確実に落とせる値。
junit.jupiter.execution.timeout.default = 60 s
