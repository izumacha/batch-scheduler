# テスト 1 件あたりの既定タイムアウト。
# Durability の FIFO 検査は「ガードが外れたら open(2) が相手を待って固まる」ことを
# 前提に回帰を検出する。上限が無いと、その退行はテスト失敗ではなく CI ジョブの
# ハング（GitHub Actions の 6 時間上限まで）として現れ、原因を示すテスト名も出ない。
# 通常のテストは 1 秒未満で終わり、最も重い JobRunner のリトライ検査でも数秒なので、
# 60 秒は正常系に影響しない余裕を持ちつつ「固まった」ことを確実に落とせる値。
junit.jupiter.execution.timeout.default = 60 s

# 上の上限を「固まったテストを実際に打ち切る」形で効かせるための設定。
#
# 既定のスレッドモードは SAME_THREAD で、そのときタイムアウトは *事後* 判定になる。
# JUnit はテスト本体と同じスレッドで実行し、戻ってきてから所要時間を見て失敗を報告する
# ため、戻ってこないテストは永久に戻ってこない。つまり SAME_THREAD のままだと、
# 上の 60 秒は「遅いテストを失敗にする」ことはできても「固まったテストを止める」ことは
# できず、この 2 行が守ろうとしているただ 1 つのケースにだけ効かない。
#
# 実測（この設定を入れる前後で、割り込みに反応しないビジーループを 1 件走らせた）:
#   SAME_THREAD     … 150 秒経っても打ち切られず、外側から kill するまで走り続けた
#   SEPARATE_THREAD … 60.1 秒で TimeoutException となり、テスト名付きで BUILD FAILURE
#
# SEPARATE_THREAD はテスト本体を別スレッド（daemon）で走らせるので、上限に達した時点で
# 失敗として報告し、残りのテストへ進める。native な open(2) でぶら下がったスレッド自体は
# 起きないままだが、daemon なので JVM の終了は妨げない。
#
# この 2 行はひとまとまりで、片方だけ消すと検出網が黙って死ぬ。
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
