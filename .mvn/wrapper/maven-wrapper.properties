# Maven Wrapper の設定。mvnw / mvnw.cmd はここに書かれた URL から Maven 本体を取得する。
#
# distributionSha256Sum は取得した配布物の SHA-256 を検証させるための設定で、
# リポジトリ側が改ざんされた場合でもビルドが汚染された Maven を実行しないための多層防御
# （CLAUDE.md §9「依存（サプライチェーン）を管理する」）。値は公式が公開している
# apache-maven-3.9.11-bin.zip.sha512 で zip を検証したうえで算出した同一 zip の SHA-256。
#
# 注意: mvnw は unzip コマンドが無い環境では自動的に同じバージョンの .tar.gz を取得しに行くが、
# 検証は「取得したファイル」に対して行われるため、その場合この zip の SHA-256 とは一致せず
# "your Maven distribution might be compromised" という紛らわしいエラーで停止する。
# そのため unzip を必須要件として README に明記している（Windows の mvnw.cmd は常に zip を使う）。
# Maven のバージョンを上げるときは distributionUrl と distributionSha256Sum を必ず同時に更新する。
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
distributionSha256Sum=0d7125e8c91097b36edb990ea5934e6c68b4440eef4ea96510a0f6815e7eeadb
